<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f2e8"><meta name="description" content="For my bb Bianca. An invitation for Saturday, 7 November.">
<title>For my bb Bianca — Let’s begin the celebration!</title>
<style>
:root{color-scheme:light;--ink:#494333;--red:#9f4437;--ease:cubic-bezier(.22,.68,.15,1)}
*{box-sizing:border-box}body{margin:0;background:#f6f2e8;color:var(--ink);font-family:Georgia,'Times New Roman',serif;min-height:100svh}body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.17;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23817864' filter='url(%23n)' opacity='.24' d='M0 0h180v180H0z'/%3E%3C/svg%3E");z-index:20}
main{min-height:100svh;display:grid;place-items:center;padding:22px 20px;overflow:hidden}.stage{width:min(340px,calc(100vw - 48px));height:570px;position:relative;perspective:1300px;transform:translateY(-120px);transition:transform 1.1s var(--ease)}.envelope{position:absolute;inset:330px 0 auto;height:210px;filter:drop-shadow(0 19px 16px #75623c20)}.back{position:absolute;inset:0;border-radius:4px;background:#dfcd87;box-shadow:inset 0 0 0 1px #bcab6e33}.slot{position:absolute;inset:-340px 12px 0;overflow:hidden;z-index:2;pointer-events:none}.pocket{position:absolute;inset:0;z-index:4;border-radius:3px;pointer-events:none;overflow:hidden}.pocket:before{content:'';position:absolute;inset:0;background:#eddda0;clip-path:polygon(0 0,51% 57%,100% 0,100% 100%,0 100%)}.pocket:after{content:'';position:absolute;inset:0;background:linear-gradient(165deg,#f0e2ac,#e4d291);clip-path:polygon(0 100%,0 96%,50% 41%,100% 96%,100% 100%)}.flap{position:absolute;inset:0;z-index:6;transform-origin:top;transform-style:preserve-3d;transition:transform .75s var(--ease),z-index 0s .35s;pointer-events:none}.flap:before,.flap:after{content:'';position:absolute;inset:0;clip-path:polygon(0 0,100% 0,51% 60%);backface-visibility:hidden;background:linear-gradient(#f2e4ac,#e6d594)}.flap:after{transform:rotateY(180deg);background:#e8d99d}.seal{position:absolute;z-index:7;left:calc(50% - 21px);top:98px;width:42px;height:42px;border:1px solid #8a392e;border-radius:48% 51% 46% 53%;background:radial-gradient(ellipse at 35% 30%,#bd6251,#9f4437 75%);box-shadow:0 3px 4px #75442d25;color:#e6b1a0;font:italic 23px Georgia;display:grid;place-items:center;transition:opacity .2s}
.letter{position:absolute;left:0;right:0;top:6px;height:354px;padding:27px 16px 16px;text-align:center;background:#fffdf6;box-shadow:0 1px 5px #6e613325;border:1px solid #e9e3d5;transform:translateY(350px);transition:transform 1.05s var(--ease) .5s;pointer-events:auto;cursor:pointer;outline-offset:-5px}.number{font:9px/1.5 Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--red);margin:0 0 20px}.letter h2{font-weight:400;font-size:27px;line-height:1.12;letter-spacing:-.6px;margin:0 0 22px}.letter p{font-size:14px;line-height:1.45;margin:0 0 13px}.letter .date{font-size:16px;line-height:1.6}.date span{font:11px Arial,sans-serif;letter-spacing:1.4px}.letter .clue{font-size:13px;color:#7a705c}.sign{color:var(--red);font-style:italic;font-size:13px;display:block;margin-top:6px}.opener{position:absolute;inset:-20px 0 0;z-index:9;border:0;background:transparent;cursor:pointer;border-radius:5px}.opener:focus-visible{outline:2px solid var(--red);outline-offset:8px}.prompt{position:absolute;top:572px;width:100%;text-align:center;color:#887d66;font:9px Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;transition:opacity .2s}.opened .stage{transform:translateY(0)}.opened .flap{transform:rotateX(180deg);z-index:1}.opened .seal{opacity:0}.opened .letter{transform:translateY(0)}.opened .opener{display:block}.opened .prompt{opacity:0}.closing .letter{transition:transform 1.15s cubic-bezier(.45,0,.2,1)}.closing .flap{transition:transform .8s cubic-bezier(.45,0,.2,1) 1.15s,z-index 0s 1.55s}.closing .seal{transition:opacity .3s 1.85s}.closing .stage{transition:transform 1s cubic-bezier(.45,0,.2,1) 1.95s}.closing .prompt{transition-delay:2.7s}@media(max-width:360px){.letter h2{font-size:25px}.letter{padding-inline:10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important;transition-delay:0s!important}}
</style>
</head>
<body>
<main id="invitation">

<div class="stage">
<div class="envelope">
<div class="back"></div>
<div class="slot"><article class="letter" id="letter" role="button" tabindex="-1" aria-label="Fold the letter back into the envelope" aria-hidden="true" inert>
<div class="number" aria-hidden="true">For my bb Bianca</div>
<h2>Let's begin<br>the celebration!</h2>

<p class="date">Saturday, 7 November.<br><span>11:30 AM.</span></p>
<p>Come hungry.</p>
<p class="clue">A little clue:<br>The highlight isn't the main course.</p>
<p>See you ma lav<span class="sign">Love, Clowns</span></p>
</article></div>
<div class="pocket"></div><div class="flap"></div><div class="seal" aria-hidden="true"></div>
<button class="opener" id="open" aria-label="Open your birthday invitation" aria-controls="letter" aria-expanded="false"></button>
</div>
<div class="prompt" aria-hidden="true">Tap to open</div>
</div>
</main>
<script>
const invitation=document.getElementById('invitation'),letter=document.getElementById('letter'),openButton=document.getElementById('open');
let timer,busy=false;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
openButton.addEventListener('click',()=>{if(busy)return;if(invitation.classList.contains('opened')){closeLetter();return}busy=true;invitation.classList.remove('closing');invitation.classList.add('opened');openButton.setAttribute('aria-expanded','true');openButton.setAttribute('aria-label','Fold the letter back into the envelope');timer=setTimeout(()=>{letter.removeAttribute('inert');letter.setAttribute('aria-hidden','false');letter.tabIndex=0;letter.focus({preventScroll:true});busy=false},reduced?0:1600)});
function closeLetter(){if(busy||!invitation.classList.contains('opened'))return;busy=true;invitation.classList.add('closing');invitation.classList.remove('opened');letter.setAttribute('inert','');letter.setAttribute('aria-hidden','true');letter.tabIndex=-1;openButton.setAttribute('aria-expanded','false');openButton.setAttribute('aria-label','Open your birthday invitation');timer=setTimeout(()=>{invitation.classList.remove('closing');openButton.focus({preventScroll:true});busy=false},reduced?0:3050)}
letter.addEventListener('click',closeLetter);letter.addEventListener('keydown',e=>{if(['Enter',' ','Escape'].includes(e.key)){e.preventDefault();closeLetter()}});
</script>
</body></html>
